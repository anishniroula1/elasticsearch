[project]
name = "ner-similarities-opensearch-demo"
version = "0.1.0"
description = "FastAPI and OpenSearch demo for NER entity similarities"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "opensearch-py>=2.8,<4",
  "pandas>=3,<4",
  "rapidfuzz>=3,<4",
  "uvicorn[standard]>=0.30,<1",
]

[tool.uv]
package = false
