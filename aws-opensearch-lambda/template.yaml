AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: NER entity create, update and delete sync for Amazon OpenSearch Service

Parameters:
  OpenSearchHost:
    Type: String
    Description: OpenSearch endpoint hostname without https
  IamAccessRoleArn:
    Type: String
    Description: IAM role ARN that Lambda assumes to access OpenSearch
  OpenSearchIndex:
    Type: String
    Default: ner_entity_occurrences
Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    Tracing: Active
    Environment:
      Variables:
        OPENSEARCH_HOST: !Ref OpenSearchHost
        OPENSEARCH_INDEX: !Ref OpenSearchIndex
        OPENSEARCH_SERVICE: es
        IAM_ACCESS_ROLE: !Ref IamAccessRoleArn

Resources:
  EntitySyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: ner_sync.entity_handler.lambda_handler
      Description: Validates and applies one NER create, update or delete event
      Timeout: 30
      MemorySize: 512
      Policies:
        - Statement:
            - Sid: AssumeOpenSearchAccessRole
              Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: !Ref IamAccessRoleArn

Outputs:
  EntitySyncFunctionName:
    Value: !Ref EntitySyncFunction
  EntitySyncFunctionArn:
    Value: !GetAtt EntitySyncFunction.Arn
  EntitySyncRoleArn:
    Value: !GetAtt EntitySyncFunctionRole.Arn
