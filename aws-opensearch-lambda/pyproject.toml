[project]
name = "ner-opensearch-lambda"
version = "0.1.0"
description = "AWS Lambda that syncs NER database events with Amazon OpenSearch Service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.40,<2",
  "opensearch-py>=2.8,<4",
  "pydantic>=2.8,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
  "--cov=ner_sync",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]

[tool.coverage.report]
show_missing = true

[tool.uv]
package = false
