services:
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 30

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.8.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  api:
    build: .
    environment:
      OPENSEARCH_HOST: ${OPENSEARCH_HOST:-opensearch}
      OPENSEARCH_PORT: ${OPENSEARCH_PORT:-9200}
      OPENSEARCH_USE_SSL: ${OPENSEARCH_USE_SSL:-false}
      OPENSEARCH_VERIFY_CERTS: ${OPENSEARCH_VERIFY_CERTS:-false}
      OPENSEARCH_AUTH_MODE: ${OPENSEARCH_AUTH_MODE:-none}
      OPENSEARCH_SERVICE: ${OPENSEARCH_SERVICE:-es}
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-ner_entity_occurrences-v1}
      OPENSEARCH_ALIAS: ${OPENSEARCH_ALIAS:-ner_entity_occurrences}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      IAM_ACCESS_ROLE: ${IAM_ACCESS_ROLE:-}
      AUTO_SEED: ${AUTO_SEED:-true}
      SEED_COUNT: ${SEED_COUNT:-10000}
      SEED_CSV_ROOT: /project
    volumes:
      # CSV files added to the project are available without rebuilding the API.
      - ./:/project:ro
    ports:
      - "8000:8000"
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  opensearch-data:
