services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8008:8000"
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=5)
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
